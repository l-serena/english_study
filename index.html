<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b87">
  <title>First English Lesson</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>First English Lesson</h1>
  </header>

  <main>
    <section aria-labelledby="greetings-title">
      <h2 id="greetings-title">Greetings and names</h2>
      <div class="card-grid four">
        <button class="phrase-card" data-phrase="Hello!" data-audio="audio/hello.mp3">
          <img src="images/hello.jpg" alt="Two people waving hello">
          <span>Hello!</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="My name is Serena." data-audio="audio/my-name-is.mp3">
          <img src="images/my-name-is.jpg" alt="A person pointing to himself while saying his name">
          <span>My name is ______.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="Nice to meet you." data-audio="audio/nice-to-meet-you.mp3">
          <img src="images/nice-to-meet-you.jpg" alt="Two people meeting and shaking hands">
          <span>Nice to meet you.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="Goodbye!" data-audio="audio/goodbye.mp3">
          <img src="images/goodbye.jpg" alt="A person leaving and waving goodbye">
          <span>Goodbye!</span><small>🔊</small>
        </button>
      </div>
    </section>

    <section aria-labelledby="feelings-title">
      <div class="section-heading">
        <div><h2 id="feelings-title">How are you?</h2></div>
        <button class="listen-pill" data-phrase="How are you?" data-audio="audio/how-are-you.mp3">How are you? 🔊</button>
      </div>
      <div class="card-grid four">
        <button class="phrase-card" data-phrase="I am happy." data-audio="audio/i-am-happy.mp3">
          <img src="images/happy.jpg" alt="A happy person">
          <span>I am happy.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am sad." data-audio="audio/i-am-sad.mp3">
          <img src="images/sad.jpg" alt="A sad person">
          <span>I am sad.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am tired." data-audio="audio/i-am-tired.mp3">
          <img src="images/tired.jpg" alt="A tired person yawning">
          <span>I am tired.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am angry." data-audio="audio/i-am-angry.mp3">
          <img src="images/angry.jpg" alt="An angry person with folded arms">
          <span>I am angry.</span><small>🔊</small>
        </button>
      </div>
    </section>

    <section aria-labelledby="jobs-title">
      <h2 id="jobs-title">I Am — Jobs</h2>
      <div class="card-grid two">
        <button class="phrase-card" data-phrase="I am a teacher." data-audio="audio/i-am-a-teacher.mp3">
          <img src="images/teacher.jpg" alt="A teacher at a board">
          <span>I am a teacher.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am a cook." data-audio="audio/i-am-a-cook.mp3">
          <img src="images/cook.jpg" alt="A cook preparing food">
          <span>I am a cook.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am a doctor." data-audio="audio/i-am-a-doctor.mp3">
          <img src="images/doctor.png" alt="A doctor in a white coat">
          <span>I am a doctor.</span><small>🔊</small>
        </button>
        <button class="phrase-card" data-phrase="I am a cleaner." data-audio="audio/i-am-a-cleaner.mp3">
          <img src="images/cleaner.jpg" alt="A cleaner holding cleaning supplies">
          <span>I am a cleaner.</span><small>🔊</small>
        </button>
      </div>
    </section>

    <section class="practice" aria-labelledby="practice-title">
       <iframe width="700" height="394" src="https://www.youtube.com/embed/RLs9lIy5WT0?si=Dv5UHnf_ZUcW0fZu&amp;start=11" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
  </main>

  <footer>First English Lesson • Speaking and listening</footer>
  <script src="script.js"></script>
</body>
</html>
